name: Diagnose cargo-deny failure
on:
  push:
    branches: ["release-maintenance/0.170.0-cancel-old"]
    paths: [".github/workflows/ercode-deny-diagnostic.yml"]
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read exact failed cargo-deny log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error, urllib.parse
          token = os.environ["GH_TOKEN"]
          headers = {"Authorization": "Bearer " + token, "Accept": "application/vnd.github+json"}
          base = "https://api.github.com/repos/erquren/ercode/actions"
          with urllib.request.urlopen(urllib.request.Request(base + "/jobs/135033389045", headers=headers), timeout=30) as r:
              job = json.load(r)
          assert job["run_id"] == 44369861769 and job["conclusion"] == "failure"
          with urllib.request.urlopen(urllib.request.Request(base + "/runs/44369861769", headers=headers), timeout=30) as r:
              run = json.load(r)
          assert run["head_sha"] == "3bfab5c1ca47af9a38550b53be47f4580765fbbb"
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, hdrs, newurl):
                  return None
          try:
              response = urllib.request.build_opener(NoRedirect()).open(urllib.request.Request(base + "/jobs/135033389045/logs", headers=headers), timeout=30)
          except urllib.error.HTTPError as error:
              assert error.code == 302
              location = error.headers["Location"]
              assert urllib.parse.urlsplit(location).scheme == "https"
              response = urllib.request.urlopen(location, timeout=30)
          with response:
              log = response.read().decode("utf-8", errors="replace")
          print("\n".join(log.replace(token, "***").splitlines()[-100:]))
          PY
