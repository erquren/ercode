name: ercode release
run-name: ercode packages ${{ inputs.tag || github.ref_name }}

on:
  push:
    branches: [main, "fix/**", "release-build/**"]
    paths: ["scripts/release/**", ".github/workflows/ercode-release.yml"]
  pull_request:
    paths: ["scripts/release/**", ".github/workflows/ercode-release.yml"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        default: "0.166.0"
        type: string
      publish:
        description: Publish after all four packages pass (requires an existing tag)
        required: true
        default: false
        type: boolean
      replace_draft_assets:
        description: Replace mismatched draft files (never a published release)
        required: true
        default: false
        type: boolean
      platform:
        description: Build all platforms, or retry one platform without publishing
        required: true
        default: all
        type: choice
        options:
          - all
          - linux-x86_64-musl
          - linux-aarch64-musl
          - macos-aarch64
          - windows-x86_64

permissions:
  contents: read

concurrency:
  group: ercode-release-${{ inputs.tag || github.ref }}-${{ inputs.platform || 'all' }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
      version: ${{ steps.version.outputs.version }}
      source_sha: ${{ steps.version.outputs.source_sha }}
    steps:
      - name: Select source for the package check
        id: request
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          BRANCH_NAME: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PYTHON'
          import os, re
          tag = os.environ["REQUESTED_TAG"]
          branch = os.environ["BRANCH_NAME"]
          if not tag and os.environ["EVENT_NAME"] == "push" and branch.startswith("release-build/"):
              tag = branch.removeprefix("release-build/")
          if tag:
              assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(?:[-+][A-Za-z0-9.-]+)?", tag), tag
          ref = "refs/tags/" + tag if tag else os.environ["SOURCE_SHA"]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"tag={tag}\nref={ref}\n")
          PYTHON
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ steps.request.outputs.ref }}
          persist-credentials: false
          path: source
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          path: packaging
          sparse-checkout: scripts/release
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Test packaging helpers
        run: python -m unittest discover -s packaging/scripts/release -p 'test_*.py'
      - name: Resolve immutable source commit and version
        id: version
        env:
          REQUESTED_TAG: ${{ steps.request.outputs.tag }}
        run: |
          python - <<'PYTHON'
          import os, re, subprocess, tomllib
          from pathlib import Path
          version = tomllib.loads(Path("source/codex-rs/Cargo.toml").read_text())["workspace"]["package"]["version"]
          tag = os.environ["REQUESTED_TAG"]
          commit = subprocess.check_output(["git", "-C", "source", "rev-parse", "HEAD"], text=True).strip()
          if tag:
              assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(?:[-+][A-Za-z0-9.-]+)?", tag), tag
              assert version == tag, (version, tag)
              ref = subprocess.check_output(["git", "-C", "source", "ls-remote", "origin", f"refs/tags/{tag}", f"refs/tags/{tag}^{{}}"], text=True)
              refs = {name: sha for sha, name in (line.split() for line in ref.splitlines())}
              expected = refs.get(f"refs/tags/{tag}^{{}}", refs.get(f"refs/tags/{tag}"))
              assert expected and commit == expected, "Checkout must match the exact existing release tag"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\nsource_sha={commit}\n")
          PYTHON
      - id: matrix
        env:
          SELECTED_PLATFORM: ${{ inputs.platform }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          rows = [
              dict(platform="linux-x86_64-musl", target="x86_64-unknown-linux-musl", runner="ubuntu-24.04", jobs=2),
              dict(platform="linux-aarch64-musl", target="aarch64-unknown-linux-musl", runner="ubuntu-24.04-arm", jobs=2),
              dict(platform="macos-aarch64", target="aarch64-apple-darwin", runner="macos-15", jobs=1),
              dict(platform="windows-x86_64", target="x86_64-pc-windows-msvc", runner="windows-2022", jobs=2),
          ]
          selected = os.environ["SELECTED_PLATFORM"] or "all"
          rows = [row for row in rows if selected == "all" or row["platform"] == selected]
          assert rows, selected
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("value=" + json.dumps(rows) + "\n")
          PYTHON

  build:
    name: Build ${{ matrix.platform }}
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      RELEASE_TAG: ${{ needs.plan.outputs.version }}
      TARGET: ${{ matrix.target }}
      CODEX_REPO_ROOT: ${{ github.workspace }}/source
      CARGO_BUILD_JOBS: ${{ matrix.jobs }}
      CARGO_INCREMENTAL: "0"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      # Keep optimized release builds within standard hosted-runner memory limits.
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      RUST_MIN_STACK: "8388608"
      AWS_LC_SYS_NO_JITTER_ENTROPY: "1"
      LIBSQLITE3_FLAGS: SQLITE_DISABLE_INTRINSIC
    steps:
      - name: Enable long paths on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: packaging
          persist-credentials: false
          sparse-checkout: scripts/release
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Configure build directory
        shell: bash
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/t" >> "$GITHUB_ENV"
      - name: Validate release version
        shell: bash
        run: |
          python -c 'import os,tomllib; from pathlib import Path; v=tomllib.loads(Path("source/codex-rs/Cargo.toml").read_text())["workspace"]["package"]["version"]; assert v==os.environ["RELEASE_TAG"], (v,os.environ["RELEASE_TAG"])'
      - name: Free build space on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: "1.95.0"
          targets: ${{ matrix.target }}
      - name: Set up Zig for MUSL
        if: runner.os == 'Linux'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: "0.14.0"
          use-cache: false
      - name: Install MUSL dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build protobuf-compiler
          bash source/.github/scripts/install-musl-build-tools.sh
      - name: Configure macOS target
        if: runner.os == 'macOS'
        shell: bash
        run: |
          echo 'MACOSX_DEPLOYMENT_TARGET=14.0' >> "$GITHUB_ENV"
          xcodebuild -version
          df -h
      - name: Configure MSVC
        if: runner.os == 'Windows'
        uses: ./source/.github/actions/setup-msvc-env
        with:
          target: ${{ matrix.target }}
      - name: Configure Windows native dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command nasm -ErrorAction SilentlyContinue)) {
            choco install nasm --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'NASM installation failed' }
          }
          'C:\Program Files\NASM' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          'LIBCLANG_PATH=C:\Program Files\LLVM\bin' | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a
        with:
          workspaces: source/codex-rs -> ${{ runner.temp }}/t
          shared-key: ercode-release-${{ matrix.target }}-hosted-v1
          cache-on-failure: true
          cache-workspace-crates: true
      - name: Build static ripgrep for Linux ARM64
        if: matrix.target == 'aarch64-unknown-linux-musl'
        shell: bash
        working-directory: source/codex-rs
        env:
          PCRE2_SYS_STATIC: "1"
        run: cargo install ripgrep --version 15.2.0 --features pcre2 --locked --target "$TARGET" --root "$RUNNER_TEMP/er-ripgrep"
      - name: Build and verify native package
        shell: bash
        run: |
          extra=()
          if [[ "$TARGET" == "aarch64-unknown-linux-musl" ]]; then
            extra+=(--rg-bin "$RUNNER_TEMP/er-ripgrep/bin/rg")
          fi
          python packaging/scripts/release/package_er.py --source source --target "$TARGET" --output-dir dist "${extra[@]}"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: er-${{ needs.plan.outputs.version }}-${{ matrix.platform }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish four-platform release
    if: github.event_name == 'workflow_dispatch' && inputs.publish && inputs.platform == 'all'
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: ercode-publish-${{ needs.plan.outputs.version }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          sparse-checkout: scripts/release
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Verify provenance, upload and publish the complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.plan.outputs.version }}
          REPLACE_DRAFT_ASSETS: ${{ inputs.replace_draft_assets }}
        shell: bash
        run: |
          extra=()
          if [[ "$REPLACE_DRAFT_ASSETS" == "true" ]]; then
            extra+=(--replace-draft-assets)
          fi
          python scripts/release/publish_er.py --tag "$RELEASE_TAG" --runs "$GITHUB_RUN_ID" "${extra[@]}"
