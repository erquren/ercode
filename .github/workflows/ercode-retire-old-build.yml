name: Retire superseded 0.170.0 package build
on:
  push:
    branches: ["release-maintenance/0.170.0-cancel-old"]
    paths: [".github/workflows/ercode-retire-old-build.yml"]
permissions:
  contents: read
  actions: write
jobs:
  retire:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify and cancel only the superseded package run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          base = "https://api.github.com/repos/erquren/ercode/actions/runs/44333673876"
          headers = {"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json"}
          with urllib.request.urlopen(urllib.request.Request(base, headers=headers), timeout=30) as response:
              run = json.load(response)
          assert run["id"] == 44333673876
          assert run["repository"]["full_name"] == "erquren/ercode"
          assert run["head_sha"] == "330446b9c2aacc370734319b296f28c0979b3301"
          assert run["path"] == ".github/workflows/ercode-release.yml"
          if run["status"] == "completed":
              print("Old run already completed; no action taken")
          else:
              request = urllib.request.Request(base + "/cancel", data=b"", headers=headers, method="POST")
              with urllib.request.urlopen(request, timeout=30) as response:
                  assert response.status == 202
              print("Cancellation requested for superseded run 44333673876 only")
          PY
