name: Retire superseded repair checks
on:
  push:
    branches: ["release-maintenance/0.170.0-cancel-old"]
    paths: [".github/workflows/ercode-retire-old-build.yml"]
permissions:
  contents: read
  actions: write
jobs:
  retire:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Cancel only reviewed superseded repair runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          reviewed = {
              44335394292: ("8551b45d81b9954cdf88ed9a7d34be13f0622395", "blocking-ci"),
              44335394530: ("8551b45d81b9954cdf88ed9a7d34be13f0622395", "postmerge-ci"),
              44335801079: ("70c77497bbae0db1f526c28cdbb065716d15383f", "blocking-ci"),
              44335801449: ("70c77497bbae0db1f526c28cdbb065716d15383f", "postmerge-ci"),
              44338685698: ("6997fab1fc3f163f85abe310571b45011e9c31c8", "blocking-ci"),
              44338685355: ("6997fab1fc3f163f85abe310571b45011e9c31c8", "postmerge-ci"),
          }
          headers = {"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json"}
          for run_id, (sha, workflow) in reviewed.items():
              base = f"https://api.github.com/repos/erquren/ercode/actions/runs/{run_id}"
              with urllib.request.urlopen(urllib.request.Request(base, headers=headers), timeout=30) as response:
                  run = json.load(response)
              assert run["id"] == run_id and run["repository"]["full_name"] == "erquren/ercode"
              assert run["head_sha"] == sha and run["head_branch"] == "main" and run["event"] == "push"
              assert run["path"] == f".github/workflows/{workflow}.yml"
              if run["status"] == "completed":
                  print(f"{run_id} already completed; no action")
                  continue
              with urllib.request.urlopen(urllib.request.Request(base + "/cancel", data=b"", headers=headers, method="POST"), timeout=30) as response:
                  assert response.status == 202
              print(f"Requested cancellation of superseded repair run {run_id}")
          PY
